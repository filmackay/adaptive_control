[project]
name = "adaptive_control"
version = "0.0.1"
description = "Adaptive Control custom component for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "homeassistant",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-homeassistant-custom-component",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
addopts = "--cov=custom_components.adaptive_control --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "RUF", # Ruff specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "ARG", # flake8-unused-arguments
]

ignore = [
    "D107", # Missing docstring in __init__
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"] # Pytest fixtures are often unused arguments

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25
